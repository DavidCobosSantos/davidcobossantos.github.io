<!DOCTYPE>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo formulario</title>
</head>
<body>
<form action="https://w3schools.com/action_page.php" method="get">
    <fieldset>
        <legend>Información de contacto</legend>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="nombre"><br>
        <label for="email">Email:</label>
        <input type="email" id="email"><br>
        <label for="message">Mensaje:</label>
        <textarea id="message"></textarea>
        <p>
            <label>Indica la mascota</label>
            <input type="checkbox" name="gato">Gato<br>
            <input type="checkbox" name="perro">Perro<br>
            <input type="checkbox" name="leon">León<br>
        </p>
        <p>
            <label>Sexo</label>
            <input type="radio" name="sexo" value="hombre">Hombre<br>
            <input type="radio" name="sexo" value="mujer">Mujer<br>
            <input type="radio" name="sexo" value="otro">Otro<br>
        </p>
        <label for="numero">Número</label>
          <input type="number" name="numero" id="numero" min="16" max="50"><br>

        </fieldset>
    <button type="submit" id="Botón">Botón</button>
    <button type="submit" id="Enviar">Enviar</button>
    <button type="reset" id="Limpiar">Limpiar</button>
</form>
</body>
</html>
