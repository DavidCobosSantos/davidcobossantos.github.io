<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>
<form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
    <label for="usuario">Nombre de usuario o Email:  </label>
    <input type="text" name="usuario" id="usuario" placeholder="usuario@dominio.com" required>
    <label for="password">Contraseña: </label>
    <input type="password" name="password" id="password" required>
    <label type="recordar">Casilla de verificación: </label>
    <input type="checkbox" name="recordar" id="recordar">
    <button type="submit">Iniciar sesión</button>
</form>
</body>
